# coturn, configured as a relay for shadNet's ICE peer connections.
#
# This file holds only the settings that are the same on every deployment. The
# two that are not -- the shared secret and the advertised public address --
# are appended at start-up by the compose service from .env, so that neither
# has to live in a file tracked by git.
#
# ICE gathers relay candidates alongside direct candidates. Gathering an
# allocation does not mean the connection will ultimately use the relay.

# Not 3478, the IANA default: a residential ISP that filters inbound
# traffic tends to do it on low ports, so every port this deployment
# exposes is five digits.
listening-port=31478

# Long-term credentials derived from a shared secret, which is how shadNet
# issues them: the server hands each player a username of
# "<expiry>:<npid>" and base64(HMAC-SHA1(secret, username)), and coturn
# verifies it without ever being told about that player.
# use-auth-secret enables long-term authentication internally.
use-auth-secret
realm=shadnet

fingerprint

# The relay port range. Every allocation gets a port from here, so this whole
# range has to be reachable from the internet -- forwarding the listening
# port alone gets you an allocation the peer can never send to. Forty ports
# is twenty concurrent relayed sessions, far more than a co-op server needs.
#
# Kept below the ephemeral range (32768-60999 on Linux): a relay port that
# overlaps it can lose a race to an unrelated outgoing connection, and the
# allocation that fails is the one a player was waiting on.
min-port=31500
max-port=31540

# A relay is bandwidth somebody else can spend. Cap it.
user-quota=12
total-quota=60

# Nothing here serves a browser or an operator console.
no-cli
# shadNet currently uses plain TURN. No certificates are deployed here.
no-tls
no-dtls
no-multicast-peers

# Use the container log as the only log destination. This also flushes logs
# to Docker instead of leaving recent sessions in a private buffered file.
log-file=stdout
new-log-timestamp
pidfile=/tmp/turnserver.pid

# libjuice uses ordinary Binding requests, not RFC 5780 CHANGE_REQUEST.
no-rfc5780

# Never relay to the machine itself or to the private network it sits on: an
# allocation is an open socket, and without these a player could use it to
# reach the LAN behind the server.
# ICE may try these candidates before choosing a public path. A "peer IP
# denied" message is this policy rejecting one candidate, not an allocation
# failure. Keep the rules even when both players report private candidates.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
